<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Nhập Quản Trị | VolPi Media</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      background: radial-gradient(circle at 50% 15%, #1e1b4b 0%, #090d16 55%, #030712 100%);
      min-height: 100vh;
    }
    .glass-panel {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glow-cyan {
      box-shadow: 0 0 50px -10px rgba(14, 165, 233, 0.25);
    }
  </style>
</head>
<body class="text-slate-100 font-sans antialiased flex items-center justify-center p-4 min-h-screen">

  <div class="w-full max-w-md space-y-6">
    
    <!-- Branding Header -->
    <div class="text-center space-y-2">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-tr from-sky-500 to-indigo-600 shadow-xl shadow-sky-500/25 mb-1 font-black text-2xl text-white">
        ⚡
      </div>
      <h1 class="text-2xl sm:text-3xl font-black tracking-tight text-white">
        VolPi Media Hub
      </h1>
      <p class="text-xs text-slate-400">Hệ Thống Quản Trị Server Stremio & Kênh IPTV</p>
    </div>

    <!-- Login Card -->
    <div class="glass-panel rounded-2xl p-6 sm:p-8 glow-cyan relative overflow-hidden">
      
      <!-- Top Decorative Line -->
      <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-sky-500 via-indigo-500 to-emerald-500"></div>

      <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4 pt-1">
        
        <!-- Error Alert -->
        <div id="error-alert" class="hidden p-3 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-300 text-xs flex items-center gap-2.5">
          <i data-lucide="alert-circle" class="w-4 h-4 text-rose-400 shrink-0"></i>
          <span id="error-message">Tên đăng nhập hoặc mật khẩu không đúng</span>
        </div>

        <!-- Username Input -->
        <div>
          <label for="username" class="block text-xs font-semibold text-slate-300 mb-1.5 flex items-center gap-1.5">
            <i data-lucide="user" class="w-3.5 h-3.5 text-sky-400"></i>
            <span>Tên Đăng Nhập</span>
          </label>
          <div class="relative">
            <input type="text" id="username" name="username" value="admin" required autocomplete="username"
              placeholder="Nhập tên đăng nhập (vd: admin)..."
              class="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500 transition font-medium placeholder:text-slate-600">
          </div>
        </div>

        <!-- Password Input -->
        <div>
          <label for="password" class="block text-xs font-semibold text-slate-300 mb-1.5 flex items-center gap-1.5">
            <i data-lucide="lock" class="w-3.5 h-3.5 text-sky-400"></i>
            <span>Mật Khẩu hoặc Mã PIN</span>
          </label>
          <div class="relative">
            <input type="password" id="password" name="password" required autocomplete="current-password"
              placeholder="Mật khẩu hoặc mã PIN bảo mật..."
              class="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500 transition font-medium placeholder:text-slate-600 pr-10">
            <button type="button" onclick="togglePasswordVisibility()" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300 transition cursor-pointer">
              <i data-lucide="eye" id="eye-icon" class="w-4 h-4"></i>
            </button>
          </div>
        </div>

        <!-- Remember Me Checkbox -->
        <div class="flex items-center justify-between pt-1">
          <label class="flex items-center gap-2 cursor-pointer text-xs text-slate-400 hover:text-slate-300">
            <input type="checkbox" id="remember-me" checked class="w-4 h-4 rounded bg-slate-900 border-slate-700 text-sky-600 focus:ring-sky-500 cursor-pointer">
            <span>Duy trì đăng nhập (30 ngày)</span>
          </label>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="btn-submit" class="w-full py-3 px-4 rounded-xl bg-gradient-to-r from-sky-500 to-indigo-600 hover:from-sky-400 hover:to-indigo-500 text-white font-bold text-sm flex items-center justify-center gap-2 shadow-lg shadow-sky-500/25 transition cursor-pointer mt-2">
          <span id="btn-text">Đăng Nhập Quản Trị</span>
          <i data-lucide="arrow-right" class="w-4 h-4" id="btn-icon"></i>
        </button>
      </form>

      <!-- Credentials Hint -->
      <div class="mt-6 pt-5 border-t border-slate-800/80 text-center">
        <div class="p-3 rounded-xl bg-slate-900/70 border border-slate-800 text-[11px] text-slate-400 space-y-1">
          <div class="flex items-center justify-center gap-1.5 font-semibold text-slate-300">
            <i data-lucide="shield-check" class="w-3.5 h-3.5 text-emerald-400"></i>
            <span>Thông Tin Đăng Nhập Mặc Định:</span>
          </div>
          <p>Tài khoản: <strong class="text-white font-mono">admin</strong> &nbsp;|&nbsp; Mật khẩu: <strong class="text-white font-mono">admin123</strong></p>
          <p class="text-[10px] text-slate-500">Hoặc sử dụng mã PIN TV: <strong class="text-sky-300 font-mono">3105</strong></p>
        </div>
      </div>

    </div>

    <!-- Quick Footer Links -->
    <div class="flex items-center justify-center gap-4 text-xs text-slate-500">
      <a href="/download" class="hover:text-sky-400 transition flex items-center gap-1">
        <i data-lucide="smartphone" class="w-3.5 h-3.5"></i>
        <span>Tải App TV & iOS</span>
      </a>
      <span>•</span>
      <span class="text-slate-600">VolPi Media v1.3.0</span>
    </div>

  </div>

  <script>
    if (window.lucide) {
      lucide.createIcons();
    }

    function togglePasswordVisibility() {
      const pass = document.getElementById('password');
      const icon = document.getElementById('eye-icon');
      if (pass.type === 'password') {
        pass.type = 'text';
        icon.setAttribute('data-lucide', 'eye-off');
      } else {
        pass.type = 'password';
        icon.setAttribute('data-lucide', 'eye');
      }
      if (window.lucide) lucide.createIcons();
    }

    async function handleLogin(e) {
      e.preventDefault();
      const userEl = document.getElementById('username');
      const passEl = document.getElementById('password');
      const rememberEl = document.getElementById('remember-me');
      const errBox = document.getElementById('error-alert');
      const errMsg = document.getElementById('error-message');
      const btn = document.getElementById('btn-submit');
      const btnText = document.getElementById('btn-text');

      errBox.classList.add('hidden');
      btn.disabled = true;
      btnText.textContent = 'Đang xác thực...';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: userEl.value.trim(),
            password: passEl.value.trim(),
            rememberMe: rememberEl.checked
          })
        });

        const data = await res.json();

        if (data.success && data.token) {
          // Store token in localStorage as backup
          localStorage.setItem('volpi_token', data.token);
          localStorage.setItem('volpi_user', data.username || 'admin');

          btnText.textContent = 'Đăng nhập thành công!';
          btn.className = btn.className.replace('from-sky-500 to-indigo-600', 'from-emerald-500 to-teal-600');

          // Check redirect URL
          const urlParams = new URLSearchParams(window.location.search);
          const redirect = urlParams.get('redirect') || '/';
          setTimeout(() => {
            window.location.href = redirect;
          }, 400);
        } else {
          errMsg.textContent = data.error || 'Tên đăng nhập hoặc mật khẩu không đúng';
          errBox.classList.remove('hidden');
          btn.disabled = false;
          btnText.textContent = 'Đăng Nhập Quản Trị';
          passEl.focus();
        }
      } catch (err) {
        errMsg.textContent = 'Lỗi kết nối máy chủ: ' + err.message;
        errBox.classList.remove('hidden');
        btn.disabled = false;
        btnText.textContent = 'Đăng Nhập Quản Trị';
      }
    }

    // Auto-focus password on load
    document.addEventListener('DOMContentLoaded', () => {
      const pass = document.getElementById('password');
      if (pass) pass.focus();
    });
  </script>
</body>
</html>
