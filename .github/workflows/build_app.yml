name: Build VolPi Media APK & IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android TV & Mobile APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Scaffold Platform Wrapper
        working-directory: app-tv
        run: |
          cp pubspec.yaml /tmp/pubspec.yaml || true
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml || true
          flutter create . --platforms=android --org=com.volpi --project-name=volpi_media
          mkdir -p android/app/src/main
          cp /tmp/AndroidManifest.xml android/app/src/main/AndroidManifest.xml || true
          cp /tmp/pubspec.yaml pubspec.yaml || true

      - name: Get Dependencies
        working-directory: app-tv
        run: flutter pub get

      - name: Build Release APK
        working-directory: app-tv
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VolPi-Media-AndroidTV
          path: app-tv/build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    name: Build iOS No-Codesign Payload
    runs-on: macos-latest
    continue-on-error: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Scaffold Platform Wrapper
        working-directory: app-tv
        run: |
          cp pubspec.yaml /tmp/pubspec.yaml || true
          cp ios/Runner/Info.plist /tmp/Info.plist || true
          flutter create . --platforms=ios --org=com.volpi --project-name=volpi_media
          mkdir -p ios/Runner
          cp /tmp/Info.plist ios/Runner/Info.plist || true
          cp /tmp/pubspec.yaml pubspec.yaml || true

      - name: Get Dependencies
        working-directory: app-tv
        run: flutter pub get

      - name: Build iOS (No codesign)
        working-directory: app-tv
        run: |
          flutter build ios --release --no-codesign --config-only
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;\n\t\t\t\tCODE_SIGNING_ALLOWED = NO;/g' ios/Runner.xcodeproj/project.pbxproj || true
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Create Unsigned IPA Package
        working-directory: app-tv
        run: |
          APP_PATH=$(find build -name "Runner.app" -type d | head -n 1)
          if [ -n "$APP_PATH" ]; then
            mkdir -p Payload
            cp -r "$APP_PATH" Payload/
            zip -r VolPi-Media-iOS.ipa Payload
          else
            echo "Runner.app not found"
            exit 1
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VolPi-Media-iOS
          path: app-tv/VolPi-Media-iOS.ipa
