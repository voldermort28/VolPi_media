name: Build VolPi Media APK & IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android TV & Mobile APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Scaffold Platform Wrapper
        working-directory: app-tv
        run: |
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml || true
          flutter create . --platforms=android --org=com.volpi
          cp /tmp/AndroidManifest.xml android/app/src/main/AndroidManifest.xml || true

      - name: Get Dependencies
        working-directory: app-tv
        run: flutter pub get

      - name: Build Release APK
        working-directory: app-tv
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VolPi-Media-AndroidTV
          path: app-tv/build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    name: Build iOS No-Codesign Payload
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Scaffold Platform Wrapper
        working-directory: app-tv
        run: |
          cp ios/Runner/Info.plist /tmp/Info.plist || true
          flutter create . --platforms=ios --org=com.volpi
          cp /tmp/Info.plist ios/Runner/Info.plist || true

      - name: Get Dependencies
        working-directory: app-tv
        run: flutter pub get

      - name: Build iOS (No codesign)
        working-directory: app-tv
        run: flutter build ios --release --no-codesign

      - name: Create Unsigned IPA Package
        working-directory: app-tv
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r VolPi-Media-iOS.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VolPi-Media-iOS
          path: app-tv/VolPi-Media-iOS.ipa
