name: Build VolPi Media APK & IPA

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android TV & Mobile APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Configure Gradle Mirrors and Properties
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m" >> ~/.gradle/gradle.properties
          echo "org.gradle.daemon=false" >> ~/.gradle/gradle.properties
          cat << 'EOF' > ~/.gradle/init.gradle
          allprojects {
              buildscript {
                  repositories {
                      google()
                      mavenCentral()
                      maven { url 'https://repo1.maven.org/maven2/' }
                      maven { url 'https://plugins.gradle.org/m2/' }
                  }
              }
              repositories {
                  google()
                  mavenCentral()
                  maven { url 'https://repo1.maven.org/maven2/' }
                  maven { url 'https://plugins.gradle.org/m2/' }
              }
          }
          beforeSettings { settings ->
              settings.pluginManagement.repositories {
                  google()
                  mavenCentral()
                  maven { url 'https://repo1.maven.org/maven2/' }
                  maven { url 'https://plugins.gradle.org/m2/' }
                  gradlePluginPortal()
              }
          }
          EOF

      - name: Scaffold Platform Wrapper
        working-directory: app-tv
        run: |
          cp pubspec.yaml /tmp/pubspec.yaml || true
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml || true
          cp android/volpi_release.keystore /tmp/volpi_release.keystore || true
          cp android/key.properties /tmp/key.properties || true
          flutter create . --platforms=android --org=com.volpi --project-name=volpi_media
          mkdir -p android/app/src/main
          cp /tmp/AndroidManifest.xml android/app/src/main/AndroidManifest.xml || true
          cp /tmp/pubspec.yaml pubspec.yaml || true
          cp /tmp/volpi_release.keystore android/volpi_release.keystore || true
          cp /tmp/volpi_release.keystore android/app/volpi_release.keystore || true
          cp /tmp/key.properties android/key.properties || true
          cp /tmp/key.properties android/app/key.properties || true

          sed -i 's|mavenCentral()|mavenCentral()\n        maven { url "https://repo1.maven.org/maven2/" }\n        maven { url "https://plugins.gradle.org/m2/" }|g' android/build.gradle || true
          sed -i 's|mavenCentral()|mavenCentral()\n        maven { url "https://repo1.maven.org/maven2/" }\n        maven { url "https://plugins.gradle.org/m2/" }|g' android/settings.gradle || true

          # Apply permanent release signing configuration for consistent APK signatures across CI runs
          cat << 'EOF' > android/app/signing.gradle
          android {
              signingConfigs {
                  release {
                      storeFile file("${project.rootDir}/volpi_release.keystore")
                      storePassword "volpimedia2026"
                      keyAlias "volpi_key"
                      keyPassword "volpimedia2026"
                  }
                  debug {
                      storeFile file("${project.rootDir}/volpi_release.keystore")
                      storePassword "volpimedia2026"
                      keyAlias "volpi_key"
                      keyPassword "volpimedia2026"
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
                  debug {
                      signingConfig signingConfigs.debug
                  }
              }
          }
          EOF
          echo "apply from: 'signing.gradle'" >> android/app/build.gradle

      - name: Get Dependencies
        working-directory: app-tv
        run: flutter pub get

      - name: Build Release APK
        working-directory: app-tv
        run: flutter build apk --release || (echo "Retrying flutter build apk with verbose logs..." && flutter build apk --release -v)

      - name: Prepare Release APK with Version
        working-directory: app-tv
        run: |
          RAW_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d ' ' | tr -d '\r')
          CLEAN_VERSION=$(echo $RAW_VERSION | cut -d '+' -f 1)
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RELEASE_TAG="${{ github.ref_name }}"
          else
            RELEASE_TAG="v${CLEAN_VERSION}"
          fi
          echo "RELEASE_TAG=$RELEASE_TAG" >> $GITHUB_ENV
          echo "CLEAN_VERSION=$CLEAN_VERSION" >> $GITHUB_ENV
          
          APK_DIR="build/app/outputs/flutter-apk"
          cp "$APK_DIR/app-release.apk" "$APK_DIR/VolPi-Media-${RELEASE_TAG}.apk"
          cp "$APK_DIR/app-release.apk" "$APK_DIR/VolPi-Media-AndroidTV.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VolPi-Media-${{ env.RELEASE_TAG }}
          path: app-tv/build/app/outputs/flutter-apk/VolPi-Media-${{ env.RELEASE_TAG }}.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "VolPi Media ${{ env.RELEASE_TAG }}"
          body: |
            ## 🚀 VolPi Media ${{ env.RELEASE_TAG }} - Ứng dụng xem Trực tiếp Bóng Đá & Phim

            ### 🌟 Tính năng chính:
            - 📺 **Giao diện Android TV (10-foot UI)**: Điều hướng 100% bằng remote D-pad, hiệu ứng phóng to 1.06x và viền phát quang xanh neon.
            - ⚽ **Bóng Đá Trực Tiếp (Xôi Lạc)**: Tự động refresh khi vào tab, hỗ trợ chọn BLV trực tiếp trong player.
            - 🍿 **Anime & Phim lẻ**: Tốc độ phát nhanh, phụ đề và lồng tiếng đầy đủ.
            - 🔒 **Profile Bí Mật (Zero-Trace)**: Nút Profile góc trên, mã PIN bí mật `3105` mở kho phim riêng tư, tự động xóa sạch dữ liệu khỏi RAM khi thoát.

            ### 📥 Hướng dẫn cài đặt trên Android TV / Google TV / Android Phone:
            1. Tải file **`VolPi-Media-${{ env.RELEASE_TAG }}.apk`** bên dưới.
            2. Chép vào USB cắm vào TV hoặc dùng ứng dụng **Send Files to TV** để chuyển file sang TV.
            3. Cài đặt và mở app từ màn hình chính TV.
          files: |
            app-tv/build/app/outputs/flutter-apk/VolPi-Media-${{ env.RELEASE_TAG }}.apk
            app-tv/build/app/outputs/flutter-apk/VolPi-Media-AndroidTV.apk
          draft: false
          prerelease: false

      - name: Deploy APK to VPS OTA Server
        continue-on-error: true
        run: |
          echo "Deploying APK to VPS OTA server..."
          curl -f -X POST -H "Content-Type: application/octet-stream" \
            --data-binary "@app-tv/build/app/outputs/flutter-apk/VolPi-Media-AndroidTV.apk" \
            "https://stremio.laboon.vn/api/upload-release?filename=VolPi-Media-AndroidTV.apk&version=${{ env.CLEAN_VERSION }}&token=volpi_ota_deploy_secret_9988" || true

  build-ios:
    name: Build iOS No-Codesign Payload
    runs-on: macos-latest
    continue-on-error: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Scaffold Platform Wrapper
        working-directory: app-tv
        run: |
          cp pubspec.yaml /tmp/pubspec.yaml || true
          cp ios/Runner/Info.plist /tmp/Info.plist || true
          cp ios/Podfile /tmp/Podfile || true
          flutter create . --platforms=ios --org=com.volpi --project-name=volpi_media
          mkdir -p ios/Runner
          cp /tmp/Info.plist ios/Runner/Info.plist || true
          cp /tmp/pubspec.yaml pubspec.yaml || true
          cp /tmp/Podfile ios/Podfile || true
          mkdir -p ios/Flutter
          echo "ENABLE_USER_SCRIPT_SANDBOXING=NO" >> ios/Flutter/Release.xcconfig
          echo "DEVELOPMENT_TEAM=ABCDE12345" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGNING_ALLOWED=NO" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGNING_REQUIRED=NO" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGN_IDENTITY=-" >> ios/Flutter/Release.xcconfig

      - name: Get Dependencies
        working-directory: app-tv
        run: flutter pub get

      - name: Build iOS (No codesign)
        working-directory: app-tv
        run: |
          sed -i '' 's/ENABLE_USER_SCRIPT_SANDBOXING = YES;/ENABLE_USER_SCRIPT_SANDBOXING = NO;/g' ios/Runner.xcodeproj/project.pbxproj || true
          sed -i '' 's/buildSettings = {/buildSettings = {\n\t\t\t\tDEVELOPMENT_TEAM = "ABCDE12345";\n\t\t\t\tCODE_SIGN_STYLE = Manual;\n\t\t\t\tCODE_SIGN_IDENTITY = "-";\n\t\t\t\tCODE_SIGNING_ALLOWED = NO;\n\t\t\t\tCODE_SIGNING_REQUIRED = NO;/g' ios/Runner.xcodeproj/project.pbxproj || true
          flutter build ios --release --no-codesign

      - name: Extract Release Tag
        working-directory: app-tv
        run: |
          RAW_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d ' ' | tr -d '\r')
          CLEAN_VERSION=$(echo $RAW_VERSION | cut -d '+' -f 1)
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RELEASE_TAG="${{ github.ref_name }}"
          else
            RELEASE_TAG="v${CLEAN_VERSION}"
          fi
          echo "RELEASE_TAG=$RELEASE_TAG" >> $GITHUB_ENV

      - name: Create Unsigned IPA Package
        working-directory: app-tv
        run: |
          APP_PATH=$(find build -name "Runner.app" -type d | head -n 1)
          if [ -n "$APP_PATH" ]; then
            mkdir -p Payload
            cp -r "$APP_PATH" Payload/
            zip -r VolPi-Media-iOS.ipa Payload
            cp VolPi-Media-iOS.ipa "VolPi-Media-${RELEASE_TAG}.ipa"
          else
            echo "Runner.app not found"
            exit 1
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VolPi-Media-iOS
          path: app-tv/VolPi-Media-iOS.ipa

      - name: Attach IPA to GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            app-tv/VolPi-Media-iOS.ipa
            app-tv/VolPi-Media-${{ env.RELEASE_TAG }}.ipa

      - name: Deploy IPA to VPS OTA Server
        continue-on-error: true
        run: |
          echo "Deploying IPA to VPS OTA server..."
          curl -f -X POST -H "Content-Type: application/octet-stream" \
            --data-binary "@app-tv/VolPi-Media-iOS.ipa" \
            "https://stremio.laboon.vn/api/upload-release?filename=VolPi-Media-iOS.ipa&version=${{ env.RELEASE_TAG }}&token=volpi_ota_deploy_secret_9988" || true

  build-macos:
    name: Build macOS Desktop App (.app / .zip)
    runs-on: macos-latest
    continue-on-error: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Scaffold Platform Wrapper
        working-directory: app-tv
        run: |
          cp pubspec.yaml /tmp/pubspec.yaml || true
          mkdir -p /tmp/macos_entitlements
          cp macos/Runner/*.entitlements /tmp/macos_entitlements/ 2>/dev/null || true
          flutter create . --platforms=macos --org=com.volpi --project-name=volpi_media
          mkdir -p macos/Runner
          cp /tmp/macos_entitlements/*.entitlements macos/Runner/ 2>/dev/null || true
          cp /tmp/pubspec.yaml pubspec.yaml || true

          # Grant Sandbox Network Entitlements for IPTV & API streaming
          /usr/libexec/PlistBuddy -c "Add :com.apple.security.network.client bool true" macos/Runner/DebugProfile.entitlements 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :com.apple.security.network.client true" macos/Runner/DebugProfile.entitlements
          /usr/libexec/PlistBuddy -c "Add :com.apple.security.network.client bool true" macos/Runner/Release.entitlements 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :com.apple.security.network.client true" macos/Runner/Release.entitlements
          /usr/libexec/PlistBuddy -c "Add :com.apple.security.network.server bool true" macos/Runner/DebugProfile.entitlements 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :com.apple.security.network.server true" macos/Runner/DebugProfile.entitlements
          /usr/libexec/PlistBuddy -c "Add :com.apple.security.network.server bool true" macos/Runner/Release.entitlements 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :com.apple.security.network.server true" macos/Runner/Release.entitlements

          # Configure release build settings for CI runner
          mkdir -p macos/Flutter
          mkdir -p macos/Runner/Configs
          echo "CODE_SIGNING_ALLOWED=NO" >> macos/Flutter/Release.xcconfig
          echo "CODE_SIGNING_REQUIRED=NO" >> macos/Flutter/Release.xcconfig
          echo "CODE_SIGN_IDENTITY=-" >> macos/Flutter/Release.xcconfig
          echo "CODE_SIGNING_ALLOWED=NO" >> macos/Runner/Configs/Release.xcconfig
          echo "CODE_SIGNING_REQUIRED=NO" >> macos/Runner/Configs/Release.xcconfig
          echo "CODE_SIGN_IDENTITY=-" >> macos/Runner/Configs/Release.xcconfig

      - name: Get Dependencies
        working-directory: app-tv
        run: flutter pub get

      - name: Build macOS App (Release)
        working-directory: app-tv
        run: |
          sed -i '' 's/ENABLE_USER_SCRIPT_SANDBOXING = YES;/ENABLE_USER_SCRIPT_SANDBOXING = NO;/g' macos/Runner.xcodeproj/project.pbxproj || true
          sed -i '' 's/CODE_SIGN_IDENTITY = "Apple Development";/CODE_SIGN_IDENTITY = "-";/g' macos/Runner.xcodeproj/project.pbxproj || true
          sed -i '' 's/buildSettings = {/buildSettings = {\n\t\t\t\tDEVELOPMENT_TEAM = "ABCDE12345";\n\t\t\t\tCODE_SIGN_STYLE = Manual;\n\t\t\t\tCODE_SIGN_IDENTITY = "-";\n\t\t\t\tCODE_SIGNING_ALLOWED = NO;\n\t\t\t\tCODE_SIGNING_REQUIRED = NO;/g' macos/Runner.xcodeproj/project.pbxproj || true
          flutter build macos --release || (echo "Retrying flutter build macos with verbose logs..." && flutter build macos --release -v)

      - name: Extract Release Tag
        working-directory: app-tv
        run: |
          RAW_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d ' ' | tr -d '\r')
          CLEAN_VERSION=$(echo $RAW_VERSION | cut -d '+' -f 1)
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RELEASE_TAG="${{ github.ref_name }}"
          else
            RELEASE_TAG="v${CLEAN_VERSION}"
          fi
          echo "RELEASE_TAG=$RELEASE_TAG" >> $GITHUB_ENV
          echo "CLEAN_VERSION=$CLEAN_VERSION" >> $GITHUB_ENV

      - name: Create macOS Zip Package
        working-directory: app-tv
        run: |
          APP_PATH=$(find build/macos -name "*.app" -type d | head -n 1)
          if [ -n "$APP_PATH" ]; then
            APP_DIR=$(dirname "$APP_PATH")
            APP_NAME=$(basename "$APP_PATH")
            echo "Target .app found: $APP_PATH"
            # Apply ad-hoc signature so macOS allows opening
            codesign --force --deep --sign - "$APP_PATH" || true
            cd "$APP_DIR"
            zip -r -y "../../../VolPi-Media-macOS.zip" "$APP_NAME"
            cd ../../..
            cp VolPi-Media-macOS.zip "VolPi-Media-macOS-${RELEASE_TAG}.zip"
          else
            echo "Error: .app file not found in build/macos"
            exit 1
          fi

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VolPi-Media-macOS
          path: app-tv/VolPi-Media-macOS.zip

      - name: Attach macOS Zip to GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            app-tv/VolPi-Media-macOS.zip
            app-tv/VolPi-Media-macOS-${{ env.RELEASE_TAG }}.zip

      - name: Deploy macOS Zip to VPS OTA Server
        continue-on-error: true
        run: |
          echo "Deploying macOS Zip to VPS OTA server..."
          curl -f -X POST -H "Content-Type: application/octet-stream" \
            --data-binary "@app-tv/VolPi-Media-macOS.zip" \
            "https://stremio.laboon.vn/api/upload-release?filename=VolPi-Media-macOS.zip&version=${{ env.RELEASE_TAG }}&token=volpi_ota_deploy_secret_9988" || true
